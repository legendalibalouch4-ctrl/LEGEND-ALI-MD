<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEGEND ALI MD | Pairing</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(
      rgba(3, 5, 18, 0.68),
      rgba(3, 5, 18, 0.88)
    ),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.card {
  width: 100%;
  max-width: 390px;
  padding: 28px 22px;
  text-align: center;
  background: rgba(5, 8, 25, 0.88);
  border: 1px solid #5577ff;
  border-radius: 20px;
  box-shadow:
    0 0 20px #315bff66,
    0 0 45px #9c27b055;
  backdrop-filter: blur(8px);
}

h1 {
  color: #a9c5ff;
  font-size: 27px;
  margin-bottom: 12px;
  text-shadow: 0 0 15px #426bff;
}

.subtitle {
  font-size: 14px;
  color: #e1d7ff;
  margin-bottom: 25px;
}

label {
  display: block;
  text-align: left;
  font-size: 13px;
  margin-bottom: 9px;
  color: #d7dcff;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 14px;
  color: white;
  background: #0c1027;
  border: 1px solid #536bff;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #b5c8ff;
  box-shadow: 0 0 12px #536bff66;
}

button,
.owner-btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
  background: linear-gradient(90deg, #245bff, #8b35d6);
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.owner-btn {
  background: linear-gradient(90deg, #171d42, #5531a8);
  border: 1px solid #718bff;
}

#result {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border: 1px solid #536bff;
  border-radius: 12px;
  background: #080d22;
}

#pairCode {
  display: block;
  color: #b9cbff;
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 3px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

#message {
  color: #d5d9f4;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 14px;
}

.footer {
  margin-top: 22px;
  color: #a9b0d1;
  font-size: 12px;
  line-height: 1.8;
}
</style>
</head>

<body>

<main class="card">

  <h1>👑 LEGEND ALI MD</h1>

  <p class="subtitle">
    WELCOME TO THE ALI WORLD ✨
  </p>

  <form id="pairForm">

    <label for="phone">
      Enter WhatsApp number with country code
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      placeholder="923001234567"
      autocomplete="tel"
      required
    >

    <button id="generateBtn" type="submit">
      GENERATE PAIRING CODE
    </button>

  </form>

  <a
    class="owner-btn"
    href="https://wa.me/923200352181"
    target="_blank"
    rel="noopener noreferrer"
  >
    💬 CONTACT OWNER 👑
  </a>

  <div id="result" aria-live="polite">
    <p>Your Pairing Code</p>
    <span id="pairCode"></span>
    <button id="copyBtn" type="button">
      COPY PAIRING CODE
    </button>
  </div>

  <p id="message" aria-live="polite"></p>

  <div class="footer">
    Official LEGEND ALI MD WhatsApp Bot<br>
    Secure Connection • Gojo Dark Edition<br>
    POWERED BY LEGEND ALI 👑
  </div>

</main>

<script>
/*
  IMPORTANT:
  Add your actual backend URL below.
  The backend must accept POST /code with:
  { "phone": "923001234567" }

  It must return JSON such as:
  { "code": "ABCD1234" }

  Do not put WhatsApp session credentials here.
*/

const API_URL = "https://YOUR-BACKEND-URL/code";

const form = document.getElementById("pairForm");
const phoneInput = document.getElementById("phone");
const generateBtn = document.getElementById("generateBtn");
const result = document.getElementById("result");
const pairCode = document.getElementById("pairCode");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const phone = phoneInput.value.replace(/\D/g, "");

  if (phone.length < 8 || phone.length > 15) {
    message.textContent =
      "Please enter a valid number with country code.";
    return;
  }

  if (API_URL.includes("YOUR-BACKEND-URL")) {
    message.textContent =
      "Pairing backend abhi connect nahi hai. Owner se backend setup karwao.";
    return;
  }

  generateBtn.disabled = true;
  generateBtn.textContent = "GENERATING...";
  message.textContent = "";
  result.style.display = "none";
  pairCode.textContent = "";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Pairing request failed."
      );
    }

    if (!data.code) {
      throw new Error(
        "Backend ne pairing code return nahi kiya."
      );
    }

    pairCode.textContent = data.code;
    result.style.display = "block";

    message.textContent =
      "Code ko WhatsApp Linked Devices pairing screen par use karo.";

  } catch (error) {
    message.textContent =
      "Pairing error: " + error.message;
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = "GENERATE PAIRING CODE";
  }
});

document.getElementById("copyBtn")
  .addEventListener("click", async function() {
    try {
      await navigator.clipboard.writeText(
        pairCode.textContent
      );
      message.textContent = "Pairing code copied!";
    } catch {
      message.textContent =
        "Code ko press karke manually copy karo.";
    }
  });
</script>

</body>
</html>
